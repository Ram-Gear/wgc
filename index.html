<style>
:root{--ink:#1d2430;--mut:#5d6878;--line:#d9dee6;--bg:#EAF7EA;--card:#fff;--acc:#2E7386;--acc2:#e3f1f4;--acch:#245E6E;--focus:#9FD3E1;--typed:#0a3d7a;--hot:#b3261e;--diff:#7a4b00;
 --mono:"Cascadia Mono","Consolas","DejaVu Sans Mono","Liberation Mono","Courier New",monospace;
 --sans:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,"Liberation Sans",sans-serif}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 var(--sans)}
/* v1.3.7 slate-green header: solid #3F5B4F, all text #fff (Durability HP reference header is blue-gray #2b3d47->#1d2b33, so Gary's fallback slate green is used) */
#bar{display:flex;align-items:center;gap:16px;box-sizing:border-box;height:72px;padding:10px 20px;background:#3F5B4F;color:#fff;border-bottom:6px solid #2e7386;position:sticky;top:0;z-index:5}
#bar a.brand{color:#fff;text-decoration:none;display:flex;align-items:center;gap:12px}
.logo{display:block;width:46px;height:46px;border-radius:8px;background:#3a4350}
#bar .sub{font-size:14px;color:#fff}
.crumb{font-size:16px;font-weight:600;color:#fff}
.grow{flex:1}
.seg{display:inline-flex;border:1px solid #5d6878;border-radius:6px;overflow:hidden}
.seg button{background:transparent;color:#1d2430;border:0;padding:6px 12px;font:600 13px var(--sans);cursor:pointer}
.seg button.on{background:#245E6E;color:#fff}
#bar .seg{display:inline-flex;border:1px solid #8a96a3;border-radius:5px;overflow:hidden}
#bar .seg button{background:transparent;color:#fff;border:0;padding:6px 12px;font:600 13px var(--sans);cursor:pointer}
#bar .seg button.on{background:#fff;color:#1d2b33}
#app{max-width:1180px;margin:0 auto;padding:18px 20px 40px}
h1{font-size:22px;margin:4px 0 6px}
.lead{color:var(--mut);margin:0 0 16px}
.menu{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.tile{display:grid;grid-template-columns:auto 1fr auto;grid-template-rows:auto auto;gap:2px 12px;background:var(--card);border:1px solid var(--line);
 border-radius:10px;padding:14px 16px;text-decoration:none;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.04)}
.tile:hover,.tile:focus{border-color:var(--acc);box-shadow:0 0 0 1px var(--acch),0 0 0 4px var(--focus);outline:none}
.tile .key{grid-row:1/3;font:700 22px var(--mono);color:#fff;background:var(--acc);border-radius:8px;width:40px;height:40px;display:flex;align-items:center;justify-content:center}
.tile .tname{font-weight:650;font-size:16px}
.tile .tid{font:600 12px var(--mono);color:var(--mut);align-self:center}
.tile .blurb{grid-column:2/4;color:var(--mut);font-size:13px}
.foot{color:var(--mut);font-size:13px;margin-top:22px}
.titlebar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.titlebar .hdr{font:600 14px var(--mono);color:var(--acc);background:var(--acc2);padding:3px 8px;border-radius:4px}
.titlebar .hdr:empty{display:none}
button{font:600 13px var(--sans);padding:7px 14px;border-radius:6px;border:1px solid var(--acc);background:var(--acc);color:#fff;cursor:pointer}
button.ghost{background:#fff;color:var(--acc)}
button:hover{background:var(--acch);border-color:var(--acch)}
button.ghost:hover{background:var(--acc2);color:var(--acch)}
.fname{font:13px var(--mono);width:130px;padding:6px 8px;border:1px solid var(--line);border-radius:6px}
.opts{display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px 14px;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:10px}
.opt{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--mut)}
.opt input,.opt select{font:14px var(--mono);padding:5px 7px;border:1px solid #b9c2cf;border-radius:5px;background:#fff;color:var(--ink);min-width:90px}
.opt input{width:110px}
.opt.sel select{min-width:170px;font-family:var(--sans)}
.opthead{font-weight:700;color:var(--ink);align-self:center}
.or{align-self:center;color:var(--mut);font-style:italic}
.msg{display:none;background:#fff7e0;border:1px solid #f0d58a;color:#5c4400;padding:8px 12px;border-radius:6px;margin-bottom:10px}
.msg.on{display:block}
table.gcp{border-collapse:separate;border-spacing:0;background:var(--card);border:1px solid var(--line);border-radius:8px;overflow:hidden;width:100%}
table.gcp th{font-size:12px;text-transform:none;color:var(--mut);text-align:left;padding:7px 10px;background:#eef1f5;border-bottom:1px solid var(--line);font-weight:650}
table.gcp td{padding:2px 10px;border-bottom:1px solid #eef0f3;font:15px var(--mono);height:34px}
table.gcp tr:last-child td{border-bottom:0}
table.gcp tr:nth-child(even) td{background:#fafbfc}
td.n{width:38px;color:var(--mut);text-align:right}
td.lab{font-family:var(--sans) !important;white-space:nowrap;width:190px}
td.g{width:190px}
td.g input{font:15px var(--mono);width:100%;padding:4px 7px;border:1px solid #c9d1dc;border-radius:5px;background:#fff;color:#56606e}
td.g input:focus,.opt input:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 1px var(--acch),0 0 0 4px var(--focus);color:var(--ink)}
input.typed{color:var(--typed) !important;font-weight:700 !important;border-color:#7aa7d8 !important;background:#f1f7ff !important}
input.bad{border-color:var(--hot) !important;background:#fff0ef !important}
td.g .val{padding-left:8px}
td.s{color:#2d3542;width:170px}
td.d{color:var(--diff);width:200px}
td.d .flag{margin-left:10px;color:#fff;background:var(--hot);border-radius:4px;padding:0 5px;font-weight:700}
td.d .flag:empty{display:none}
.hel{display:grid;grid-template-columns:1.25fr 1fr;gap:14px;align-items:start}
.hel td.lab{width:70px}
.hel td.g{width:150px}
.span{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px;margin:10px 0;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 12px}
.span .sl{font-weight:700;align-self:center}
.span .opt input{width:100px}
.spantext{font:14px var(--mono);align-self:center}
.warn .w{color:var(--hot);font-weight:650;margin:4px 0}
.warn .note{color:var(--mut);font-size:13px;margin:4px 0}
.more{display:flex;flex-direction:column;gap:8px;margin:10px 0}
.mblock{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));background:var(--card);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.mi{padding:6px 10px;border-right:1px solid #eef0f3}
.ml{display:block;font-size:11.5px;color:var(--mut)}
.mv{font:15px var(--mono)}
details.pv{margin-top:14px}
details.pv summary{cursor:pointer;color:var(--acc);font-weight:600}
pre#pv{background:#fff;border:1px solid var(--line);border-radius:6px;padding:10px;font:13px/1.3 var(--mono);overflow:auto}
.legend{color:var(--mut);font-size:13px}
.typedchip,.calcchip{font:13px var(--mono);padding:1px 6px;border-radius:4px;border:1px solid #c9d1dc}
.typedchip{color:var(--typed);font-weight:700;background:#f1f7ff;border-color:#7aa7d8}
.calcchip{color:#56606e;background:#fff}
#flash{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#245E6E;color:#fff;padding:8px 16px;border-radius:6px;opacity:0;transition:opacity .2s;pointer-events:none}
#flash.on{opacity:1}
@media (max-width:820px){.hel{grid-template-columns:1fr}.mblock{grid-template-columns:repeat(3,1fr)}td.lab{width:auto}}
/* ---- Measure / Identify and Bevel (new) */
.tile.newmod .key{background:#2f7d32}
.idmenu{margin-top:22px}
.idmenu h2{font-size:18px;margin:0 0 4px}
.idlinks{display:flex;flex-wrap:wrap;gap:8px}
a.idlink,a.btn{display:inline-block;font:600 13px var(--sans);padding:7px 14px;border-radius:6px;border:1px solid var(--acc);background:#fff;color:var(--acc);text-decoration:none}
a.idlink:hover,a.btn:hover{background:var(--acc2)}
a.btn.idbtn{background:#2f7d32;border-color:#2f7d32;color:#fff}
a.btn.ghost{background:#fff;color:var(--acc)}
.xintro{color:var(--mut);margin:4px 0 10px;font-size:14px}
.xgrid{display:grid;grid-template-columns:1.3fr 1fr;gap:14px;align-items:start}
fieldset.xset{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 12px 12px;margin:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px 14px}
fieldset.xset legend{font-weight:700;padding:0 4px}
.xf{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--mut)}
.xf input,.xf select{font:14px var(--mono);padding:5px 7px;border:1px solid #b9c2cf;border-radius:5px;background:#fff;color:var(--ink)}
.xf select{font-family:var(--sans)}
.xf input:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 1px var(--acch),0 0 0 4px var(--focus)}
.xcs{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:4px 14px;align-items:center;font-size:13px}
.xcs .xl{font-size:12px;color:var(--mut);width:100%}
.xc{white-space:nowrap}
.xnote{color:var(--mut);font-size:12.5px;margin:4px 0;grid-column:1/-1}
.idout{margin-top:12px}
.idsum{border:1px solid var(--line);border-left:6px solid #888;background:var(--card);border-radius:8px;padding:10px 14px;margin-bottom:8px}
.idsum .big{font-size:17px;margin-bottom:3px}
.idsum.conf-High{border-left-color:#2f7d32}.idsum.conf-Medium{border-left-color:#d08a00}.idsum.conf-Low{border-left-color:var(--hot)}
.idout .w{color:var(--hot);font-weight:600;margin:5px 0}
.idout .note,.warn .note.approx{color:#4b5563;font-size:13px;margin:5px 0;background:#f6f7f9;border:1px solid var(--line);border-radius:6px;padding:6px 10px}
table.idtab{border-collapse:collapse;background:var(--card);border:1px solid var(--line);margin:8px 0;font-size:13px;width:100%}
table.idtab th{background:#eef1f5;color:var(--mut);font-weight:650;text-align:left;padding:5px 8px;border-bottom:1px solid var(--line)}
table.idtab td{padding:4px 8px;border-bottom:1px solid #eef0f3;font-family:var(--mono)}
table.idtab tr.top td{background:#eef7ee;font-weight:700}
table.idtab.small{width:auto;min-width:420px}
button.use{padding:3px 10px}
details.resid summary{cursor:pointer;color:var(--acc);font-weight:600}
.bevel table.btab td.lab{width:260px}
.bout{display:flex;flex-direction:column;gap:10px;margin-top:10px}
.bout .mblock{grid-template-columns:repeat(3,minmax(0,1fr))}
.rate h2{font-size:16px;margin:6px 0}
.rgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
/* MESH screen (v1.2.0) */
.xgrid.three{grid-template-columns:1fr 1fr 1fr}
.mesh .mtab{flex:none;width:100%}
.mesh .mtab td.lab{white-space:normal}
.warn .w.err{color:var(--hot)}
.warn .w:not(.err):not(.okline){color:#9a5b00}
.warn .w.okline{color:#2e7d32}
@media (max-width:900px){.xgrid,.rgrid,.xgrid.three{grid-template-columns:1fr}}
#printdoc{display:none}
@media print{
 @page{margin:12mm}
 html,body{background:#fff}
 body>*{display:none !important}
 body>#printdoc{display:block !important;margin:0;font:10.5pt/1.25 var(--mono);color:#000;white-space:pre}
}

#credit{max-width:1180px;margin:0 auto;padding:10px 20px 18px;border-top:1px solid #d5dbe2;color:#555;font-size:13px;text-align:center}

/* ---- profile / sketch figures (ui_profile.js, viewer.js) */
.home .about{margin-top:4px;color:#555;font-size:13px}
#printfig{display:none}
.profbox{margin:14px 0;border:1px solid #d5dbe2;border-radius:8px;background:#fff}
.profbox>summary{cursor:pointer;padding:8px 12px;font-weight:600;color:#245E6E}
.fig{padding:0 10px 10px}
.figbar{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:4px 0 6px}
.figtitle{font-weight:600;color:#333;font-size:13px}
.figctls{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.figctl{font-size:13px;color:#333;display:flex;gap:4px;align-items:center}
button.small{padding:3px 9px;font-size:12px}
.seg button.small.on{background:#245E6E;color:#fff}
.figwrap{border:1px solid #e3e7ec;border-radius:6px;overflow:hidden;background:#fff}
.figsvg{display:block;width:100%;height:480px;touch-action:none;cursor:crosshair;user-select:none}
.figsvg.drag{cursor:grabbing}
.figread{font:12px var(--mono);color:#245E6E;padding:5px 2px;min-height:16px;white-space:pre-wrap}
.fignote{font-size:12.5px;color:#444}
.fignote div{margin:2px 0}
.fignote .approx{color:#8a4b00;font-weight:600}
@media print{
 body.printfig>#printdoc{display:none !important}
 body.printfig>#printfig{display:block !important}
 body.printfig>#printfig svg{width:100%;height:auto;max-height:260mm}
}
.seg button.small{background:#fff;color:#245E6E;border:1px solid #8fc0cd}
/* saved gear profiles (v1.3.0) */
.dlgov{position:fixed;inset:0;background:rgba(15,23,42,.45);display:flex;align-items:flex-start;justify-content:center;z-index:50;padding-top:8vh}
.dlg{background:#fff;border-radius:10px;box-shadow:0 12px 40px rgba(0,0,0,.25);padding:16px 20px;min-width:440px;max-width:min(940px,94vw);max-height:84vh;overflow:auto}
.dlg h2{margin:0 0 10px;font-size:18px}
.dlg .xf{display:flex;flex-direction:column;gap:3px;margin:8px 0}
.dlg input[type=text],.dlg select{font:inherit;padding:5px 8px;border:1px solid var(--line);border-radius:6px}
.dlg .w{color:var(--hot);font-weight:600;margin:6px 0;min-height:1em}
.dlg .note{color:var(--mut);font-size:13px}
.dlgbtns{display:flex;gap:8px;justify-content:flex-end;margin-top:12px;flex-wrap:wrap}
.gptab{width:100%;margin:6px 0}.gptab td,.gptab th{padding:4px 8px;text-align:left}
.gmact{white-space:nowrap}.gmact button{margin-left:4px;padding:3px 8px}
button.danger{color:#fff;background:var(--hot);border-color:var(--hot)}
.profline{margin-top:14px}
#profset .xgrid{grid-template-columns:1fr 1fr}
#profset .w{color:var(--hot);font-weight:600;margin:4px 0}
@media print{.dlgov{display:none}}
#profset{display:block}
#profset .xgrid{display:grid;gap:14px;margin-bottom:6px}
#profset .xf .note{display:block;margin-top:3px}
#profset #mprofBtn{margin-right:8px}
/* MESH results, three columns (v1.3.1): Gear 1 | Pair | Gear 2; narrow screens stack Pair first */
.mcols{display:grid;grid-template-columns:1fr 1.15fr 1fr;gap:12px;align-items:start;width:100%}
.mcol{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 12px 10px;min-width:0}
#mpair{background:#f2f8f9;border-color:#b5d6df}
.mcolh{font-weight:700;font-size:15px;margin:2px 0 6px;color:#245E6E}
#mg1 .mcolh{color:#2E7386}#mg2 .mcolh{color:#a0522d}
.msec{margin:6px 0 4px}.msech{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--mut);border-bottom:1px solid var(--line);padding-bottom:2px;margin-bottom:3px}
.mrow{display:flex;justify-content:space-between;gap:10px;padding:2px 0;font-size:14px}
.mrow .lab{color:#374151}.mrow .val{font-family:ui-monospace,Menlo,Consolas,monospace;white-space:nowrap;text-align:right}
.mbig{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px;background:#fff;border:2px solid #2E7386;border-radius:8px;padding:8px 12px;margin:2px 0 8px}
.mbig .lab{font-weight:600;color:#245E6E;flex-basis:100%}.mbig .val{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:24px;font-weight:700;color:#2E7386}

function pitchTxt(Pn) { return (S.opts.pmode || 'DP') === 'DP' ? `${+Pn.toFixed(6)} DP` : `m ${+(25.4 / Pn).toFixed(6)} mm`; }
const degTxt = (x, hel) => `${(+x).toFixed(3)}\u00b0` + (hel && Math.abs(x) < 1e-12 ? ' (spur)' : '');
function mismatchMsg(cur) {
  const GP = window.GCP3GEARS; if (!GP) return null;
  const r1 = rec(1), r2 = rec(2), out = [];
  const say = (k, la, a, lb, b) => {
    if (k === 'pitch') out.push(`Normal pitch doesn't match: ${la} ${pitchTxt(a.Pn)}, ${lb} ${pitchTxt(b.Pn)}.`);
    if (k === 'pa') out.push(`Pressure angle doesn't match: ${la} ${degTxt(a.pa)}, ${lb} ${degTxt(b.pa)}.`);
    if (k === 'ha') out.push(`Helix angle doesn't match: ${la} ${degTxt(a.ha, 1)}, ${lb} ${degTxt(b.ha, 1)}.`);
  };
  if (r1 && r2) for (const k of GP.mismatch(r1, r2)) say(k, `Gear 1 (${r1.from})`, r1, `Gear 2 (${r2.from})`, r2);
  if (!out.length) for (const [i, r] of [[1, r1], [2, r2]]) if (r) for (const k of GP.mismatch(r, cur)) say(k, `Gear ${i} (${r.from})`, r, 'the Pair fields', cur);
  return out.length ? out.join(' ') + ' Gears in mesh must have the same normal pitch, pressure angle and helix angle; the calculation is blocked.' : null;
}
const MPROF_NOTE = 'Only gears with the same pitch, pressure angle and helix angle (opposite hand for helical) can be meshed. If a saved gear doesn\u2019t appear in the list, check it for a mis-entered pitch, pressure angle or helix angle \u2014 open it on EXT/HELIX, fix it and save again.';
function pickers() {
  const GP = window.GCP3GEARS; if (!GP) return null;
  const all = GP.list().filter(p => p.mod === 'EXT' || p.mod === 'HELIX');
  const info = {}; for (const p of all) info[p.name] = GP.params(p);
  const pick = i => {
    const other = rec(3 - i);
    const ok = all.filter(p => {
      const q = info[p.name]; if (!q) return false;
      if (!other) return true;
      if (GP.mismatch(q, other).length) return false;
      const oh = S.opts['hand' + (3 - i)] || '';
      return !(q.ha > 0 && p.hand && oh && p.hand === oh);   // helical: opposite hands
    });
    const hidden = all.filter(p => !ok.includes(p)), c = S.carry && S.carry[i - 1], cur = c && c.sig === carrySig(i) ? c.from : '';
    // why each hidden gear is hidden: the value that doesn't match, with both values
    const why = p => {
      const q = info[p.name]; if (!q) return `does not compute on its ${p.mod} screen (open it there and check the inputs)`;
      const o = [], ref = `Gear ${3 - i}`;
      for (const k of GP.mismatch(q, other)) {
        if (k === 'pitch') o.push(`pitch ${pitchTxt(q.Pn)} (${ref}: ${pitchTxt(other.Pn)})`);
        if (k === 'pa') o.push(`pressure angle ${degTxt(q.pa)} (${ref}: ${degTxt(other.pa)})`);
        if (k === 'ha') o.push(`helix angle ${degTxt(q.ha, 1)} (${ref}: ${degTxt(other.ha, 1)})`);
      }
      if (!o.length) o.push(`same hand as ${ref} (${p.hand === 'R' ? 'right' : 'left'}); helical gears need opposite hands`);
      return o.join('; ');
    };
    return h('div', {class: 'mpick'},
      h('label', {class: 'xf'}, h('span', {class: 'xl'}, `Load Gear ${i} from profile`),
        h('select', {id: 'mprof' + i, onchange: e => { if (e.target.value) loadProfile(i, e.target.value); }},
          [h('option', {value: ''}, ok.length ? '\u2014 choose a saved gear \u2014' : '\u2014 no matching saved gears \u2014')].concat(ok.map(p => h('option', {value: p.name, selected: cur === `profile "${p.name}"`}, `${p.name}: ${p.mod} ${p.summary || ''}${p.hand ? ' ' + p.hand + 'H' : ''}`))))),
      hidden.length ? h('details', {class: 'mhid', id: 'mprofhid' + i},
        h('summary', {}, `${hidden.length} saved gear(s) hidden \u2014 show why`),
        h('ul', {}, hidden.map(p => h('li', {'data-name': p.name}, h('b', {}, p.name), ': ' + why(p))))) : null);
  };
  return h('fieldset', {class: 'xset', id: 'profset'}, h('legend', {}, 'Saved gears'),
    h('div', {class: 'xgrid'}, pick(1), pick(2)),
    h('p', {class: 'note mprofnote', id: 'mprofnote'}, MPROF_NOTE),
    h('div', {class: 'w', id: 'mprofmsg'}),
    h('button', {class: 'ghost', id: 'mprofBtn', onclick: () => GP.manager()}, 'Manage saved gears\u2026'),
    h('span', {class: 'note'}, ' Matching tolerance: 1e-6 relative.'));
}

// ------------------------------------------------------------------ routing: extend GCP3X (ui_extra.js)
const X0 = window.GCP3X;
window.GCP3MESHUI = {carry, carryInto, params, loadProfile, get last() { return ST.last; }, screen};
if (X0) {
  const handles = X0.handles, crumb = X0.crumb, render = X0.render;
  X0.handles = id => id === KEY || handles(id);
  X0.crumb = id => id === KEY ? 'Two-Gear Mesh' : crumb(id);
  X0.render = id => { if (id === KEY) { $('#printdoc').textContent = ''; screen(); } else render(id); };
}
})();

</script>
<script>
/* Web Gear Calc - saved gear profiles (new in v1.3.0). Plain script, loaded after ui_mesh.js.
   A profile is the whole EXT or HELIX screen state ({typed, opts}: every entered input, the thickness method and value, hob/cutter,
   Shaper Ex. and span/pin data, depth system) plus its units, so loading restores the screen exactly.
   Stored in localStorage key 'gcp3web.gears'. A file:// copy and the website (https://ram-gear.github.io/wgc/) have SEPARATE stores:
   move gears with Export / Import (JSON). */
(function () {
'use strict';
const U = window.GCP3UI, {h, flash} = U;
const $ = (s, el) => (el || document).querySelector(s);
const KEY = 'gcp3web.gears', FORMAT = 'web-gear-calc-gear-profiles', MODS_OK = ['EXT', 'HELIX'];
const TOL = 1e-6;                      // relative tolerance for "same pitch / pressure angle / helix angle"
const same = (a, b) => Math.abs(a - b) <= TOL * Math.max(Math.abs(a), Math.abs(b), 1);

function readAll() {
  try { const o = JSON.parse(window.localStorage.getItem(KEY)); return o && typeof o === 'object' && o.profiles ? o : {v: 1, profiles: {}}; } catch (e) { return {v: 1, profiles: {}}; }
}
function writeAll(o) {
  try { window.localStorage.setItem(KEY, JSON.stringify(o)); return true; } catch (e) { flash('Could not save: browser storage is full or disabled.'); return false; }
}
const tfmt = iso => { const d = new Date(iso); if (isNaN(d)) return ''; const z = n => String(n).padStart(2, '0'); return `${d.getFullYear()}-${z(d.getMonth() + 1)}-${z(d.getDate())} ${z(d.getHours())}:${z(d.getMinutes())}`; };
const list = () => Object.values(readAll().profiles).sort((a, b) => a.name.localeCompare(b.name, undefined, {numeric: true}));
const get = name => readAll().profiles[name] || null;
function put(p) { const o = readAll(); o.profiles[p.name] = p; return writeAll(o); }
function remove(name) { const o = readAll(); delete o.profiles[name]; return writeAll(o); }
function rename(from, to) { const o = readAll(); const p = o.profiles[from]; if (!p) return false; delete o.profiles[from]; p.name = to; o.profiles[to] = p; return writeAll(o); }

// gear parameters of a profile (computed off-screen): normal DP (1/in), normal PA, |helix|, N; null when it does not compute
function params(p) {
  try {
    const v = U.computeState(p.mod, p.state, p.units);
    const g = window.GCP3MESHUI && window.GCP3MESHUI.params(p.mod, v);
    return g ? Object.assign(g, {hand: p.hand || ''}) : null;
  } catch (e) { return null; }
}
// which of pitch / PA / helix differ (empty = compatible); hands checked separately
function mismatch(a, b) {
  const out = [];
  if (!same(a.Pn, b.Pn)) out.push('pitch');
  if (!same(a.pa, b.pa)) out.push('pa');
  if (!same(Math.abs(a.ha), Math.abs(b.ha))) out.push('ha');
  return out;
}
function summary(mod, v) {
  const g = window.GCP3MESHUI && v && !v.err ? window.GCP3MESHUI.params(mod, v) : null;
  if (!g) return 'does not compute';
  const pit = U.units === 'M' ? `m ${+(25.4 / g.Pn).toFixed(5)}` : `${+g.Pn.toFixed(5)} ${mod === 'HELIX' ? 'NDP' : 'DP'}`;
  return `${g.N} T, ${pit}, ${+g.pa.toFixed(4)}\u00b0` + (mod === 'HELIX' ? `, helix ${+g.ha.toFixed(4)}\u00b0` : '');
}

// ------------------------------------------------------------------ dialogs
function dialog(id, title, body, buttons) {
  close();
  const box = h('div', {class: 'dlg', id, role: 'dialog', 'aria-modal': 'true', 'aria-label': title},
    h('h2', {}, title), h('div', {class: 'dlgbody'}, body), h('div', {class: 'dlgbtns'}, buttons));
  const ov = h('div', {class: 'dlgov', id: 'dlgov', onclick: e => { if (e.target.id === 'dlgov') close(); }}, box);
  document.body.append(ov);
  const f = box.querySelector('input,select,button'); if (f) f.focus();
  return box;
}
function close() { const o = $('#dlgov'); if (o) o.remove(); }
document.addEventListener('keydown', e => { if (e.key === 'Escape' && $('#dlgov')) { e.stopPropagation(); close(); } }, true);

function nextName() { const n = new Set(list().map(p => p.name)); for (const c of 'ABCDEFGHIJKLMNOPQRSTUVWXYZ') if (!n.has('Gear ' + c)) return 'Gear ' + c; return 'Gear ' + (n.size + 1); }

function saveDialog(mod, v) {
  const existing = list();
  const name = h('input', {id: 'gp-name', type: 'text', value: nextName(), spellcheck: 'false', maxlength: '60'});
  const hand = mod === 'HELIX' ? h('select', {id: 'gp-hand'}, [['', 'not given'], ['R', 'Right hand'], ['L', 'Left hand']].map(([k, t]) => h('option', {value: k}, t))) : null;
  const warn = h('div', {class: 'w', id: 'gp-warn'});
  const sum = summary(mod, v);
  const doSave = force => {
    const nm = name.value.trim();
    if (!nm) { warn.textContent = 'Enter a name, e.g. Gear A.'; return; }
    const old = get(nm);
    if (old && !force) {
      warn.textContent = `A profile named "${nm}" already exists (${old.mod}, ${old.summary || ''}, saved ${tfmt(old.saved)}). Overwrite it?`;
      okBtn.textContent = 'Overwrite'; okBtn.id = 'gp-overwrite'; armed = true; return;
    }
    const p = {name: nm, mod, units: U.units, hand: hand ? hand.value : '', state: U.getState(mod), summary: sum, saved: new Date().toISOString(), app: window.WGC_VERSION || ''};
    if (put(p)) { close(); flash(`Saved "${nm}" (${mod}).`); }
  };
  let armed = false;
  const okBtn = h('button', {id: 'gp-save', onclick: () => doSave(armed)}, 'Save');
  name.addEventListener('input', () => { warn.textContent = ''; okBtn.textContent = 'Save'; okBtn.id = 'gp-save'; armed = false; });
  name.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); okBtn.click(); } });
  dialog('gp-savedlg', `Save gear (${mod})`, [
    h('p', {}, 'Saves every input and option on this screen (thickness method and value, hob / cutter, Shaper Ex., span / pins, depth system) and the units, in this browser.'),
    h('p', {class: 'note'}, 'This gear: ' + sum + (v && v.err ? ' (the screen has an error; the inputs are saved anyway)' : '')),
    h('label', {class: 'xf'}, h('span', {class: 'xl'}, 'Name'), name),
    hand ? h('label', {class: 'xf'}, h('span', {class: 'xl'}, 'Hand of helix (for MESH)'), hand) : null,
    existing.length ? h('p', {class: 'note'}, 'Existing: ', existing.map(p => h('a', {href: 'javascript:void 0', class: 'gp-ex', onclick: () => { name.value = p.name; name.dispatchEvent(new Event('input')); }}, p.name)).reduce((a, x) => a.concat(a.length ? [', ', x] : [x]), [])) : null,
    warn], [okBtn, h('button', {class: 'ghost', id: 'gp-cancel', onclick: close}, 'Cancel')]);
}

function loadDialog(mod) {
  const all = list(), mine = all.filter(p => p.mod === mod), other = all.length - mine.length;
  const rows = mine.map(p => h('tr', {}, h('td', {}, h('b', {}, p.name)), h('td', {}, p.summary || ''), h('td', {}, p.units === 'M' ? 'mm' : 'in'),
    h('td', {}, tfmt(p.saved)),
    h('td', {}, h('button', {class: 'gp-load', 'data-name': p.name, onclick: () => { close(); U.loadState(p.mod, p.state, p.units); flash(`Loaded "${p.name}".`); }}, 'Load'))));
  dialog('gp-loaddlg', `Load gear (${mod})`, [
    mine.length ? h('table', {class: 'gcp gptab'}, h('thead', {}, h('tr', {}, ['Name', 'Gear', 'Units', 'Saved', ''].map(t => h('th', {}, t)))), h('tbody', {}, rows))
      : h('p', {}, `No ${mod} gears saved in this browser yet. Use "Save gear\u2026", or Import a JSON file in Saved gears on the main menu.`),
    other ? h('p', {class: 'note'}, `${other} profile(s) of the other type are not shown.`) : null,
    h('p', {class: 'note'}, 'Loading replaces this screen\u2019s inputs and switches to the profile\u2019s units.')],
  [h('button', {class: 'ghost', onclick: () => manager()}, 'Manage\u2026'), h('button', {class: 'ghost', id: 'gp-cancel', onclick: close}, 'Close')]);
}

// ------------------------------------------------------------------ export / import
function exportObj(names) {
  const ps = list().filter(p => !names || names.includes(p.name));
  return {format: FORMAT, version: 1, app: window.WGC_VERSION || '', exported: new Date().toISOString(), profiles: ps};
}
function downloadJSON(obj, fname) {
  const blob = new Blob([JSON.stringify(obj, null, 1)], {type: 'application/json'}), url = URL.createObjectURL(blob);
  const a = h('a', {href: url, download: fname, style: 'display:none'}); document.body.append(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 1000);
}
const safeName = s => s.replace(/[\\/:*?"<>|]+/g, '_');
function validProfile(p) {
  return p && typeof p.name === 'string' && p.name.trim() && MODS_OK.includes(p.mod) && (p.units === 'E' || p.units === 'M')
    && p.state && typeof p.state.typed === 'object' && p.state.typed && typeof p.state.opts === 'object' && p.state.opts
    && Object.values(p.state.typed).every(x => typeof x === 'string');
}
// import: returns {added, replaced, renamed, skipped, bad}; mode for name clashes: 'replace' | 'keep' (keep both, rename) | 'skip'
function importText(text, mode) {
  let o; try { o = JSON.parse(text); } catch (e) { return {error: 'Not a JSON file.'}; }
  const arr = o && o.format === FORMAT && Array.isArray(o.profiles) ? o.profiles : null;
  if (!arr) return {error: 'Not a Web Gear Calc gear-profile file (format "' + FORMAT + '").'};
  const all = readAll(), r = {added: 0, replaced: 0, renamed: 0, skipped: 0, bad: 0};
  for (const p0 of arr) {
    if (!validProfile(p0)) { r.bad++; continue; }
    const p = {name: p0.name.trim().slice(0, 60), mod: p0.mod, units: p0.units, hand: ['R', 'L'].includes(p0.hand) ? p0.hand : '', state: {typed: p0.state.typed, opts: p0.state.opts},
      summary: typeof p0.summary === 'string' ? p0.summary : '', saved: typeof p0.saved === 'string' ? p0.saved : new Date().toISOString(), app: typeof p0.app === 'string' ? p0.app : ''};
    const old = all.profiles[p.name];
    if (old && JSON.stringify(old.state) === JSON.stringify(p.state) && old.units === p.units && old.mod === p.mod && old.hand === p.hand) { r.skipped++; continue; }
    if (old) {
      if (mode === 'skip') { r.skipped++; continue; }
      if (mode === 'keep') { let k = 2; while (all.profiles[`${p.name} (${k})`]) k++; p.name = `${p.name} (${k})`; r.renamed++; }
      else r.replaced++;
    } else r.added++;
    all.profiles[p.name] = p;
  }
  writeAll(all); return r;
}
function clashes(text) {
  try { const o = JSON.parse(text), all = readAll().profiles; return (o.profiles || []).filter(p => p && all[p.name] && JSON.stringify(all[p.name].state) !== JSON.stringify(p.state)).map(p => p.name); } catch (e) { return []; }
}

// ------------------------------------------------------------------ manager
function manager() {
  const ps = list();
  const msg = h('div', {class: 'w', id: 'gm-msg'});
  const file = h('input', {type: 'file', id: 'gm-file', accept: '.json,application/json', style: 'display:none', onchange: () => {
    const f = file.files && file.files[0]; if (!f) return;
    const rd = new FileReader();
    rd.onload = () => {
      const text = String(rd.result), cl = clashes(text);
      const finish = mode => { const r = importText(text, mode); if (r.error) { manager(); $('#gm-msg').textContent = r.error; return; }
        manager(); $('#gm-msg').textContent = `Imported: ${r.added} new, ${r.replaced} replaced, ${r.renamed} kept both (renamed), ${r.skipped} skipped` + (r.bad ? `, ${r.bad} invalid ignored` : '') + '.'; };
      if (!cl.length) { finish('replace'); return; }
      dialog('gm-clash', 'Import: names already used', [h('p', {}, `These names already exist with different gears: ${cl.join(', ')}.`)],
        [h('button', {id: 'gm-replace', onclick: () => finish('replace')}, 'Replace mine'), h('button', {id: 'gm-keep', onclick: () => finish('keep')}, 'Keep both'),
         h('button', {class: 'ghost', id: 'gm-skip', onclick: () => finish('skip')}, 'Skip those')]);
    };
    rd.readAsText(f);
  }});
  const row = p => h('tr', {'data-name': p.name},
    h('td', {}, h('b', {}, p.name)), h('td', {}, p.mod + (p.hand ? ` (${p.hand})` : '')), h('td', {}, p.summary || ''), h('td', {}, p.units === 'M' ? 'mm' : 'in'),
    h('td', {}, tfmt(p.saved)),
    h('td', {class: 'gmact'},
      h('button', {class: 'ghost gm-open', onclick: () => { close(); U.loadState(p.mod, p.state, p.units); }}, 'Open'),
      h('button', {class: 'ghost gm-rename', onclick: () => {
        const td = document.querySelector(`#gm-tab tr[data-name="${CSS.escape(p.name)}"] td`); td.textContent = '';
        const inp = h('input', {type: 'text', class: 'gm-newname', value: p.name, maxlength: '60'});
        const ok = h('button', {class: 'gm-renok', onclick: () => {
          const to = inp.value.trim(); if (!to || to === p.name) { manager(); return; }
          if (get(to) && !ok.dataset.sure) { msg.textContent = `"${to}" already exists. Click OK again to replace it.`; ok.dataset.sure = '1'; return; }
          rename(p.name, to); manager(); $('#gm-msg').textContent = `Renamed "${p.name}" to "${to}".`;
        }}, 'OK');
        td.append(inp, ok); inp.focus(); inp.select();
        inp.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); ok.click(); } });
      }}, 'Rename'),
      h('button', {class: 'ghost gm-export', onclick: () => downloadJSON(exportObj([p.name]), safeName(p.name) + '.wgc-gear.json')}, 'Export'),
      h('button', {class: 'ghost gm-delete', onclick: e => {
        const b = e.target; if (!b.dataset.sure) { b.dataset.sure = '1'; b.textContent = 'Really delete?'; b.classList.add('danger'); return; }
        remove(p.name); manager(); $('#gm-msg').textContent = `Deleted "${p.name}".`;
      }}, 'Delete')));
  dialog('gm-dlg', 'Saved gears (profiles)', [
    ps.length ? h('table', {class: 'gcp gptab', id: 'gm-tab'}, h('thead', {}, h('tr', {}, ['Name', 'Type', 'Gear', 'Units', 'Saved', ''].map(t => h('th', {}, t)))), h('tbody', {}, ps.map(row)))
      : h('p', {id: 'gm-empty'}, 'No gears saved in this browser yet. Use "Save gear\u2026" on the EXT or HELIX screen, or Import a file.'),
    msg,
    h('p', {class: 'note'}, 'Profiles are kept in this browser\u2019s storage for this location. The downloaded WebGearCalc.html (file://) and the website keep SEPARATE lists, and each browser has its own: use Export all / Import to move gears between them or to back them up.'),
    file],
  [h('button', {id: 'gm-exportall', onclick: () => { if (!list().length) { msg.textContent = 'Nothing to export.'; return; } downloadJSON(exportObj(null), 'web-gear-calc-gears-' + new Date().toISOString().slice(0, 10) + '.json'); }}, 'Export all (JSON)'),
   h('button', {id: 'gm-import', onclick: () => file.click()}, 'Import JSON\u2026'),
   h('button', {class: 'ghost', id: 'gm-close', onclick: close}, 'Close')]);
}

window.GCP3GEARS = {list, get, put, remove, rename, params, mismatch, same, TOL, saveDialog, loadDialog, manager, importText, exportObj, close, FORMAT};
})();

</script>
